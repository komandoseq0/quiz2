<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="./css/style.css">
    <script defer src="script.js"></script>
</head>

<body>

    <section class="greetingBox">
        <div class="greetingBox__icon">🧠</div>
        <h1>Witaj w quizie!</h1>
        <p>Sprawdź swoją wiedzę z zakresu programowania.<br>10 pytań, czas start.</p>
        <div class="greetingBox__buttonBox">
            <button class="startQuizBtn btn-primary">Rozpocznij →</button>
        </div>
    </section>

    <section class="quizBox hidden">
        <div class="quizBox__header">
            <span class="quizBox__progress">Pytanie <span class="currentQ">1</span> / <span class="totalQ">10</span></span>
            <span class="quizBox__score">★ <span class="scoreDisplay">0</span> pkt</span>
        </div>

        <div class="progressBar">
            <div class="progressBar__fill"></div>
        </div>

        <div class="quizbox__questionBox">
            <h2 class="question">Lorem ipsum dolor sit amet consectetur adipisicing elit. Illo, voluptatum?</h2>
        </div>

        <div class="quizBox__anserwsBox">
            <div class="quizBox__buttonBox answerBtn"><button class="answer">lorem</button></div>
            <div class="quizBox__buttonBox answerBtn"><button class="answer">lorem</button></div>
            <div class="quizBox__buttonBox answerBtn"><button class="answer">lorem</button></div>
            <div class="quizBox__buttonBox answerBtn"><button class="answer">lorem</button></div>
        </div>
    </section>

    <section class="endQuiz hidden">
        <div class="endQuiz__emoji">🎉</div>
        <div class="endQuiz__title">Koniec quizu!</div>
        <div class="endQuiz__stats">
            <div class="endQuiz__stat">
                <span class="stat-correct">0</span>
                <span>Poprawne</span>
            </div>
            <div class="endQuiz__stat">
                <span class="stat-wrong">0</span>
                <span>Błędne</span>
            </div>
        </div>
        <p class="message"></p>
        <button class="restartBtn btn-primary">Zagraj ponownie ↺</button>
    </section>

</body>

</html>
